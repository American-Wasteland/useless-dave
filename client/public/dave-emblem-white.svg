<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 18 260 300">
  <circle cx="130" cy="168" r="122" fill="none" stroke="#ffffff" stroke-width="7"/>
  <g stroke="#ffffff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- mohawk BEHIND head so base is hidden and it grows cleanly -->
    <path d="M96,150 L104,64 L120,104 L130,50 L140,104 L156,66 L164,150 Z" fill="none"/>
    <!-- ears -->
    <rect x="52" y="158" width="20" height="30" rx="9" fill="none"/>
    <rect x="188" y="158" width="20" height="30" rx="9" fill="none"/>
    <!-- face -->
    <rect x="64" y="116" width="132" height="124" rx="46" fill="none"/>
  </g>

  <!-- dead half-lidded eyes: drooping lid right over a low pupil -->
  <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M94,166 Q108,174 122,166"/>
    <path d="M138,166 Q152,174 166,166"/>
  </g>
  <g fill="#ffffff">
    <circle cx="108" cy="177" r="5"/>
    <circle cx="152" cy="177" r="5"/>
  </g>

  <!-- tiny nose -->
  <path d="M126,184 l-5,12 q4,4 9,1" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- bored mouth + tongue blep -->
  <path d="M106,208 q24,7 48,-1" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <path d="M136,210 q11,2 11,11 q0,7 -8,7 q-6,0 -6,-7 z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
</svg>
